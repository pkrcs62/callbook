const pmt=(P,r,n)=>{const i=r/1200;return i?P*i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1):P/n};
const pvl=(m,r,n)=>{const i=r/1200;return i?m*(1-Math.pow(1+i,-n))/i:m*n};
let E={veh:'petrol',asr:false,typ:'sal',cname:'',cmob:'',nmi:'',emi0:'',cic:'',rsm:'',age:'',onroad:'',fd:'',yrs:'7',mclr:'8.25',conc:'0.50',card:false,rate:'',loan:'',gov:false,lid:null,_p:{}},EMI_TXT='',EN={},RP=null;
try{E.mclr=localStorage.cbMclr3||'8.25';E.conc=localStorage.cbConc||'0.50'}catch(e){}
const scheme=()=>E.asr?'assured':(E.veh=='ev'?'green':'new');
function spr(cic,rsm,gr,yrs){const t=cic?RT[gr?'G':'A']:RT[gr?'RG':'RA'],v=cic||rsm;for(const x of t)if(v>=x[0])return yrs>5?x[2]:x[1];return null}
function emiCalc(){
const e=E,sc=scheme(),nmi=+e.nmi||0,ex=+e.emi0||0,cic=+e.cic||0,rsm=+e.rsm||0,age=+e.age||0,on=+e.onroad||0,fd=+e.fd||0,mclr=+e.mclr||0,as=sc=='assured',gr=sc=='green';
const maxY=gr?8:7,sel=Math.min(+e.yrs||maxY,maxY),ac=age?75-age:99,yrs=Math.min(sel,ac),n=Math.round(yrs*12);
const sp=(cic||rsm)?spr(cic,rsm,gr,yrs):null,conc=e.card?0:(+e.conc||0),cardR=sp!=null?mclr+sp:0,rate=+e.rate>0?+e.rate:(sp!=null?cardR-conc:0);
const need=as?(!fd||!on):(!nmi||!(cic||rsm)||!on);
if(need)return `<p class="note">${as?'Enter FD value and on-road price':'Enter income, CIBIL score (or RSM score for NTC) and on-road price'} to see the result.</p>`;
if(!rate)return `<p class="note" style="color:var(--amb)">${(cic||rsm)?'No standard rate for this score (below the rate sheet).':'Enter the CIBIL score.'} Type the rate in Rate settings.</p>`;
if(n<36)return `<p class="note" style="color:var(--red)">Tenure comes to under 3 years because of the age limit (loan must end by age 75).</p>`;
const nai=nmi*12;let cap=0;
if(!as)cap=(e.typ=='sal'&&cic>=700)?(nai<=5e5?50:nai<=1e6?60:nai<=1.5e6?70:75):(nai<=5e5?50:nai<=1e6?60:65);
const maxEmi=Math.max(0,cap/100*nmi-ex),byEmi=as?Infinity:pvl(maxEmi,rate,n);
const byInc=as?Infinity:(e.typ=='sal'?48*nmi:e.typ=='self'?4*nai:3*nai);
const s100=!as&&e.gov&&cic>=757&&nmi>=60000,byLtv=as?Math.min(on,fd):(s100?Math.max(.9*on,Math.min(on,2e6)):.9*on);
const el=Math.max(0,Math.floor(Math.min(byEmi,byInc,byLtv)/1000)*1000),use=+e.loan>0?+e.loan:el;
const em=pmt(use,rate,n),tot=em*n,intr=tot-use,ratio=nmi?(ex+em)/nmi*100:0;
const pfb=use<=5e5?750:use<=1e6?1250:1500,pf=as?0:(gr?pfb/2:pfb)*1.18;
const ck=[];const add=(ok,t)=>ck.push([ok,t]);
if(as){add(use<=fd,'Loan within 100% of FD value');add(use<=on,'Loan within on-road price');add(!age||age>=18,'Age 18 or above');add(true,'EMI/NMI and income checks not applicable');add(true,'FD must be in own name (max 2 holders), lien to be marked')}
else{add(!age||(age>=21&&age<=70),'Age 21 to 70 at sanction');add(e.typ=='sal'?nmi>=25000:e.typ=='self'?nai>=3e5:nai>=4e5,e.typ=='sal'?'Net monthly income at least ₹25,000':e.typ=='self'?'Net annual income at least ₹3,00,000':'Net annual income at least ₹4,00,000');if(cic)add(cic>=(gr?650:(e.gov?650:700)),'CIBIL at least '+(gr?'650 (rate sheet lists 650+; circular said 700)':(e.gov?'650 (Govt salary package) / 700 others':700)));else add(rsm>=41,'NTC: RSM score at least 41');add(use>=1e5,'Loan at least ₹1,00,000');add(use<=el||el===0&&use===0,'Loan within eligible amount');add(ratio<=cap,'EMI/NMI within '+cap+'% limit');if(sel>ac)add(false,'Tenure cut to '+yrs+' yrs by age-75 rule')}
const ok=ck.every(c=>c[0]);
const rows=[];let bal=use;for(let k=1;k<=n;k++){const i=bal*rate/1200,p=em-i;bal=Math.max(0,bal-p);rows.push([k,em,i,p,bal])}
const ys=[];rows.forEach(r=>{const y=Math.ceil(r[0]/12);ys[y]=ys[y]||[y,0,0,0];ys[y][1]+=r[3];ys[y][2]+=r[2];ys[y][3]=r[4]});
const nm={new:'SBI Car Loan',green:'SBI Green Car Loan',assured:'SBI Assured Car Loan'}[sc],who=(e.cname||'').trim(),VL={petrol:'Petrol',diesel:'Diesel',cng:'CNG',hybrid:'Hybrid',ev:'EV'}[e.veh];
EMI_TXT=`${who?'Customer: '+who+'\n':''}${nm} (indicative)\n${as?'':'Vehicle: '+VL+'\n'}Loan: ${Rs(use)}\nRate: ${rate.toFixed(2)}% p.a.${conc&&cardR?' (card rate '+cardR.toFixed(2)+'%)':''}\nTenure: ${yrs} years (${n} months)\nEMI: ${Rs(em)}\nTotal interest: ${Rs(intr)}\nTotal payable: ${Rs(tot)}${on?'\nOn-road price: '+Rs(on)+'\nMargin / down payment: '+Rs(Math.max(0,on-use)):''}`;
let ti=0;const tn=(k,lb,v,c)=>`<div class="${c||''}" style="--d:${(ti++)*45}"><small>${lb}</small><b class="num" data-k="${k}" data-n="${Math.round(v)}">${Rs(v)}</b></div>`,tt=(lb,v,c)=>`<div class="${c||''}" style="--d:${(ti++)*45}"><small>${lb}</small><b>${v}</b></div>`;
const pr=cap?Math.min(100,ratio/cap*100):0;
return `<div class="hro ${ok?'':'r'}" style="--d:0"><div><small>${ok?'You can finance up to':'Not eligible as entered'}</small><b class="num" data-k="el" data-n="${el}">${Rs(el)}</b><span>${nm} · ${rate.toFixed(2)}% p.a.${as?'':'<br>EMI/NMI '+ratio.toFixed(0)+'% of '+cap+'% limit'}</span></div>${as?`<div class="ring ck2">${I('check')}</div>`:`<div class="ring" data-p="${pr.toFixed(1)}"><svg viewBox="0 0 88 88"><circle class="rt" cx="44" cy="44" r="34"/><circle class="rf" cx="44" cy="44" r="34"/></svg><em>${ratio.toFixed(0)}%</em></div>`}</div>
<div class="emk">${tn('em','EMI per month',em,'w xl')}${tn('use','Loan used',use)}${tt('Rate p.a.',rate.toFixed(2)+'%'+(conc&&cardR?'<em>card '+cardR.toFixed(2)+'%</em>':''))}${tt('Tenure',yrs+' yrs')}${tn('mg','Margin',on?Math.max(0,on-use):0)}${tn('ti','Total interest',intr)}${tn('tp','Total payable',tot)}${tt('Processing fee',as?'Nil':Rs(pf)+' incl. GST','w')}</div>
${as?'':`<div class="lbl">How the limit is worked out</div><div class="lim"><span>By EMI/NMI (${cap}%, after existing EMIs)</span><b>${Rs(byEmi)}</b></div><div class="lim"><span>By income (${e.typ=='sal'?'48 x NMI':e.typ=='self'?'4 x annual income':'3 x annual income'})</span><b>${Rs(byInc)}</b></div><div class="lim"><span>By LTV (${s100?'100%, up to ₹20L':'90% of on-road'})</span><b>${Rs(byLtv)}</b></div>`}
<div class="lbl">Checks</div>${ck.map(c=>`<div class="ck ${c[0]?'ok':'no'}">${c[0]?'✓':'✗'} ${c[1]}</div>`).join('')}
<button class="pri wa" onclick="emiShare()">Share on WhatsApp</button>
<div class="lbl">Yearly summary</div><table class="sch"><tr><th>Year</th><th>Principal</th><th>Interest</th><th>Balance</th></tr>${ys.filter(Boolean).map(y=>`<tr><td>${y[0]}</td><td>${fmt(Math.round(y[1]))}</td><td>${fmt(Math.round(y[2]))}</td><td>${fmt(Math.round(y[3]))}</td></tr>`).join('')}</table>
<details class="adv"><summary>Month-by-month schedule</summary><table class="sch"><tr><th>No.</th><th>EMI</th><th>Interest</th><th>Principal</th><th>Balance</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${fmt(Math.round(r[1]))}</td><td>${fmt(Math.round(r[2]))}</td><td>${fmt(Math.round(r[3]))}</td><td>${fmt(Math.round(r[4]))}</td></tr>`).join('')}</table></details>
<p class="note" style="margin-top:14px">Indicative only, not a sanction. Rates follow the SBI car loan rate sheet (spread over 3-month MCLR, minus the concession) and match sbi.bank.in as updated 16-09-2026. Eligibility rules follow the Master Circular dated 01-01-2025. Processing fee was waived only up to 31-03-2025, so check the current waiver. Final approval depends on the bank.</p>`}
function emiAnim(){document.querySelectorAll('#er .num').forEach(el=>{const k=el.dataset.k,to=+el.dataset.n,from=EN[k]!=null?EN[k]:0;EN[k]=to;if(from===to)return;const t0=performance.now();el.textContent=Rs(from);(function f(t){const p=Math.min(1,(t-t0)/650),q=1-Math.pow(1-p,3);el.textContent=Rs(from+(to-from)*q);if(p<1&&document.body.contains(el))requestAnimationFrame(f)})(t0)});
const g=document.querySelector('#er .ring[data-p]');if(g){const c=g.querySelector('.rf'),to=+g.dataset.p,from=RP!=null?RP:0,L=213.6;RP=to;c.style.transition='none';c.style.strokeDashoffset=L*(1-from/100);requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transition='stroke-dashoffset .9s cubic-bezier(.22,1.1,.36,1)';c.style.strokeDashoffset=L*(1-to/100)}))}}
function emiRes(){const r=$('er');if(r){r.innerHTML=emiCalc();emiAnim()}}
function emiSet(k,v){E[k]=(v==='true'?true:v==='false'?false:v);if(k=='veh'||k=='asr'){const m=scheme()=='green'?8:7;if(+E.yrs>m)E.yrs='7'}const s=$('sh'),st=s.scrollTop;emi(E.lid,true);s.scrollTop=st}
function emiShare(){const l=E.lid?get(E.lid):null,p=dg(E.cmob||(l?l.mobile:''));emiCalc();window.open('https://wa.me/'+(p.length>=10?'91'+p:'')+'?text='+encodeURIComponent(EMI_TXT),'_blank')}
function seg(k,o,cur){const i=Math.max(0,o.findIndex(x=>x[0]==cur)),p=E._p[k]!=null?E._p[k]:i;E._p[k]=i;return `<div class="seg" style="--n:${o.length};--i:${i};--p:${p}"><i></i>${o.map(x=>`<button class="${x[0]==cur?'on':''}" onclick="emiSet('${k}','${x[0]}')">${x[1]}</button>`).join('')}</div>`}
function emi(id,keep){const l=id?get(id):null;if(id&&l){if(E.lid!==id){E.lid=id;E.loan=l.amount?String(l.amount):'';E.cname=l.name||'';E.cmob=l.mobile||''}}else E.lid=null;
const sc=scheme(),as=sc=='assured',gr=sc=='green',mx=gr?8:7;if(+E.yrs>mx)E.yrs='7';if(!keep){Object.keys(EN).forEach(k=>delete EN[k]);RP=null;E._p={}}
const fi=(k,lb,ph,t)=>`<label class="fl"><span>${lb}</span><input class="in" inputmode="${t||'decimal'}" placeholder="${ph}" value="${esc(E[k])}" oninput="E.${k}=this.value;emiRes()"></label>`;
const tg=(k,t)=>`<button class="tg ${E[k]?'on':''}" onclick="emiSet('${k}','${!E[k]}')"><i></i><span>${t}</span></button>`;
sh(`<div class="hd"><div><h2>EMI &amp; eligibility</h2><p>${as?'SBI Assured Car Loan':gr?'SBI Green Car Loan':'SBI Car Loan'}</p></div><button class="x" onclick="cl()">${I('x')}</button></div>
<div class="g2">${fi('cname','Customer name (optional)','Name','text')}${fi('cmob','Mobile (optional)','10 digits','tel')}</div>
${as?'':`<div class="lbl">Vehicle type</div>${seg('veh',[['petrol','Petrol'],['diesel','Diesel'],['cng','CNG'],['hybrid','Hybrid'],['ev','EV']],E.veh)}<p class="note">${gr?'EV is financed under the Green Car Loan automatically (lower rate, up to 8 years).':'Financed under the SBI Car Loan.'}</p>`}
${tg('asr','Assured loan (against FD)')}
${as?'':`<div class="lbl">Applicant</div>${seg('typ',[['sal','Salaried'],['self','Self-employed'],['agri','Agriculturist']],E.typ)}`}
${as?`<div class="g2">${fi('fd','FD value (₹)','e.g. 800000')}${fi('onroad','On-road price (₹)','e.g. 750000')}</div><div class="g2">${fi('cic','CIBIL (optional)','e.g. 740')}${fi('age','Age (optional)','e.g. 35')}</div>`:`<div class="g2">${fi('nmi',E.typ=='sal'?'Net monthly income (₹)':'Monthly net income (₹)','e.g. 60000')}${fi('emi0','Existing EMIs / month (₹)','0')}</div><div class="g2">${fi('cic','CIBIL score','e.g. 740')}${fi('rsm','RSM (NTC only)','e.g. 75')}</div><div class="g2">${fi('onroad','On-road price (₹)','e.g. 1200000')}${fi('age','Age (optional)','e.g. 35')}</div>${tg('gov','Govt/PSU salary or pension a/c with SBI (100% finance check)')}`}
<div class="lbl">Tenure (years)</div>${seg('yrs',Array.from({length:mx-2},(_,i)=>[String(i+3),String(i+3)]),String(E.yrs))}
${fi('loan','Loan amount to test (optional)','blank = maximum eligible')}
<details class="adv"><summary>Rate settings</summary><div class="g2"><label class="fl"><span>3-month MCLR % (sheet: 8.25)</span><input class="in" inputmode="decimal" value="${esc(E.mclr)}" oninput="E.mclr=this.value;try{localStorage.cbMclr3=this.value}catch(e){}emiRes()"></label><label class="fl"><span>Concession % (sheet: 0.50)</span><input class="in" inputmode="decimal" value="${esc(E.conc)}" oninput="E.conc=this.value;try{localStorage.cbConc=this.value}catch(e){}emiRes()"></label></div>${tg('card','Use card rate (no concession)')}${fi('rate','Rate override % (optional)','blank = SBI rate sheet')}</details>
<div id="er" style="margin-top:14px"></div>`);
emiRes();if(!keep){const r=$('er');r.classList.add('anim');setTimeout(()=>r.classList.remove('anim'),1400)}}

document.addEventListener('pointerdown',e=>{const b=e.target.closest('.pri,.ghost,.big a,.chips button,.call');if(!b)return;const r=b.getBoundingClientRect();b.style.setProperty('--x',e.clientX-r.left+'px');b.style.setProperty('--y',e.clientY-r.top+'px');b.classList.remove('rp');void b.offsetWidth;b.classList.add('rp');setTimeout(()=>b.classList.remove('rp'),700)},{passive:true});
/* ---- auto theme: dark 6 PM to 6 AM, light otherwise ---- */
function TP(){try{return localStorage.cbTheme||'auto'}catch(e){return'auto'}}
function autoTheme(){const h=new Date().getHours(),p=TP(),d=(p=='light'||p=='dark')?p:((h>=18||h<6)?'dark':'light'),r=document.documentElement;if(r.getAttribute('data-theme')!=d)r.setAttribute('data-theme',d)}
function setTheme(m){try{if(m=='auto')localStorage.removeItem('cbTheme');else localStorage.cbTheme=m}catch(e){}autoTheme();more()}
autoTheme();setInterval(autoTheme,60000);document.addEventListener('visibilitychange',autoTheme);addEventListener('focus',autoTheme);
boot();
</script></body></html>
