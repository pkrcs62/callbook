function authUI(msg){$('app').innerHTML=`<div class="auth"><h1 class="logo">Callbook</h1><p style="color:var(--mut);margin:0 0 10px">Your team's follow-up desk.</p><input class="in" id="em" type="email" placeholder="Email" autocomplete="username"><input class="in" id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="pri" onclick="login()">Sign in</button><button class="ghost" onclick="signup()">Create account (team members only)</button><p id="am" style="color:var(--amb)">${msg||''}</p></div>`}
async function login(){const{error}=await SB.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)$('am').textContent=error.message;else boot()}
async function signup(){const{data,error}=await SB.auth.signUp({email:$('em').value.trim(),password:$('pw').value});if(error)$('am').textContent=error.message;else if(data.session)boot();else $('am').textContent='Check your email to confirm, then sign in.'}
async function boot(){const{data:{session}}=await SB.auth.getSession();if(!session)return authUI();const{data:t}=await SB.from('chasr_team').select('*');S.team=t||[];S.me=S.team.find(x=>x.email.toLowerCase()==session.user.email.toLowerCase());if(!S.me){authUI('Not on the team yet. Ask the admin to add '+esc(session.user.email));SB.auth.signOut();return}
let nm;try{nm=localStorage.cbName}catch(e){}if(nm)S.me.name=nm;await load();SB.channel('l').on('postgres_changes',{event:'*',schema:'public',table:'chasr_leads'},()=>{clearTimeout(boot.t);boot.t=setTimeout(load,400)}).subscribe();nm?popup():askName();deep()}
async function load(){const{data}=await SB.from('chasr_leads').select('*').order('created_at',{ascending:false});S.leads=data||[];render()}
/* ---- views ---- */
const lastR=l=>{const r=[...(l.remarks||[])].reverse().find(r=>r.text&&r.by!='import');return r?r.text:''};
const dueTag=l=>{const d=dd(l.followup);if(l.status!='open')return `<small class="due n">${l.status.replace('_',' ')}</small>`;if(d==null||d<0)return '';return d==0?'<small class="due a">Today</small>':`<small class="due n">${d==1?'Tomorrow':sd(l.followup)}</small>`};
const acts=l=>{const p=dg(l.mobile);return p.length<10?'':`<a class="b1" href="tel:${p}">${I('phone')}</a><a class="b2" href="https://wa.me/91${p}" target="_blank" rel="noopener">${I('wa')}</a><a class="b3" href="sms:${p}">${I('sms')}</a>`};
const card=l=>`<div class="card" style="--c:${CT[l.segment]}" onclick="openL('${l.id}')"><i class="av" style="background:${C[l.segment]}">${esc((l.name[0]||'?').toUpperCase())}</i><div class="mid"><b>${esc(l.name)}</b><span><em style="color:${CT[l.segment]}">${l.segment}</em>${l.amount?' · ₹'+fmt(l.amount):''}</span>${lastR(l)?`<span class="rem">“${esc(lastR(l))}”</span>`:''}${dueTag(l)}</div><div class="acts" onclick="event.stopPropagation()">${acts(l)}</div></div>`;
const grp=(t,a)=>a.length?`<h3>${t} · ${a.length}</h3>${a.map(card).join('')}`:'';
function render(){const k=S.tab+S.day+S.seg+S.st,an=render.k!==k;render.k=k;const o=S.leads.filter(l=>l.status=='open'),ov=o.filter(l=>l.followup&&l.followup<TD()).sort((a,b)=>a.followup<b.followup?-1:1),td=o.filter(l=>l.followup==TD()),nw=o.filter(l=>!l.followup);let v;
if(S.tab=='today'){const day=S.day||TD(),fl=l=>S.seg=='All'||l.segment==S.seg,on=d=>o.filter(l=>fl(l)&&(d==TD()?(!l.followup||l.followup<=TD())&&!hd(l):l.followup==d)).sort((a,b)=>(a.followup||'')<(b.followup||'')?-1:1),A=on(day),cnt=(d,s)=>o.filter(l=>l.segment==s&&(d==TD()?(!l.followup||l.followup<=TD())&&!hd(l):l.followup==d)).length,days=Array.from({length:7},(_,i)=>add(i)),dn=d=>new Date(d+'T00:00');
v=`<div class="hero"><small>${day==TD()?'Today':dn(day).toLocaleDateString('en-IN',{day:'numeric',month:'short'})} · leads to call</small><b>${A.length}</b><span>${S.leads.filter(hd).length} updated today · ${o.length} open leads</span></div><div class="tiles">${SEG.map((s,i)=>{const n=cnt(day,s),T=[['#ffe3e0','#b42318','Car'],['#e0e7ff','#3730a3','Personal'],['#d7f5e3','#166534','Pension'],['#fdecc4','#92400e','Misc']][i];return `<div class="tile${S.seg==s?' on':''}" style="background:${T[0]};color:${T[1]}" onclick="S.seg=S.seg=='${s}'?'All':'${s}';render()"><small>${T[2]}</small><b>${n}</b><i class="pdf" onclick="event.stopPropagation();pdf('${s}','today')">${I('file')}</i></div>`}).join('')}</div><h3>${day==TD()?'Today':dn(day).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'})} · ${A.length}</h3>${A.map(card).join('')||'<div class="empty">Nothing scheduled. Tap + to add a lead.</div>'}`}
else{const q=S.q.toLowerCase();let a=S.leads.filter(l=>(S.seg=='All'||l.segment==S.seg)&&l.status!='not_interested'&&(S.st=='all'||(S.st=='open'?l.status=='open':l.status!='open'))&&(!q||(l.name+l.mobile+(l.company||'')).toLowerCase().includes(q)));
v=`<div class="chips">${['All',...SEG].map(s=>`<button class="${S.seg==s?'on':''}" onclick="S.seg='${s}';render()">${s}</button>`).join('')}</div><div class="chips">${[['open','Open'],['done','Closed'],['all','All']].map(([k,n])=>`<button class="${S.st==k?'on':''}" onclick="S.st='${k}';render()">${n}</button>`).join('')}</div><button class="ghost" onclick="pdf(S.seg,S.st=='open'?'open':'all')">${I('file')} Export ${S.seg=='All'?'all leads':S.seg} as PDF</button><div id="ll" style="margin-top:10px">${a.map(card).join('')||'<div class="empty">No leads here.</div>'}</div><button class="mini" onclick="ni()">Not interested · ${S.leads.filter(l=>l.status=='not_interested').length}</button>`}
$('app').innerHTML=`<div class="wrap${an?' anim':''}"><div class="top"><div class="brand logo">Callbook</div><h1>${S.tab=='today'?'Hi, '+esc(S.me.name||'there'):'Leads'}</h1><p>${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</p></div><div class="search">${I('search')}<input id="sq" placeholder="Search name, mobile, company…" value="${esc(S.q)}" oninput="S.q=this.value;srch()" autocomplete="off"></div><div id="res" style="display:none"></div><div id="mn">${v}</div></div><div class="nav"><button class="${S.tab=='today'?'on':''}" onclick="S.tab='today';render()">${I('today')}Today</button><button class="${S.tab=='leads'?'on':''}" onclick="S.tab='leads';render()">${I('list')}Leads</button><button class="fab" onclick="form()">${I('plus')}</button><button onclick="exp()">${I('file')}PDF</button><button onclick="more()">${I('more')}More</button></div>`;srch()}
function list(){const q=S.q.toLowerCase(),a=S.leads.filter(l=>(S.seg=='All'||l.segment==S.seg)&&l.status!='not_interested'&&(S.st=='all'||(S.st=='open'?l.status=='open':l.status!='open'))&&(!q||(l.name+l.mobile+(l.company||'')).toLowerCase().includes(q)));$('ll').innerHTML=a.map(card).join('')||'<div class="empty">No leads here.</div>'}
/* ---- lead detail ---- */
function openL(id){FU=null;const l=get(id),p=dg(l.mobile),h=[...(l.remarks||[])].reverse().filter(r=>r.text).slice(0,3);sh(`<div class="hd"><div><h2>${esc(l.name)}</h2><p>${l.segment}${l.company?' · '+esc(l.company):''}${l.amount?' · ₹'+fmt(l.amount):''}</p></div><div style="display:flex;gap:8px"><button class="x" onclick="form('${id}')">${I('edit')}</button><button class="x" onclick="cl()">${I('x')}</button></div></div>
${p.length>=10?`<div class="big"><a class="b1" href="tel:${p}">${I('phone')}Call</a><a class="b2" href="https://wa.me/91${p}" target="_blank" rel="noopener">${I('wa')}WhatsApp</a><a class="b3" href="sms:${p}">${I('sms')}Text</a></div>`:''}
<textarea id="rm" placeholder="Write a remark…"></textarea>
<div class="chips one">${['Not reachable','Call back','Interested'].map(t=>`<button onclick="$('rm').value=($('rm').value+' '+this.textContent).trim()">${t}</button>`).join('')}</div>
<div class="chips one"><label class="dt req" id="dtl">${I('today')}<span id="fl">Next follow-up date</span><input type="date" min="${TD()}" onchange="FU=this.value;$('fl').textContent=FU?sd(FU):'Next follow-up date';$('dtl').classList.toggle('req',!FU)"></label></div>
<button class="pri" onclick="saveR('${id}')">Save</button>${h.map(r=>`<div class="hist">${esc(r.text)}<small>${esc(r.by||'')} ${r.at?'· '+new Date(r.at).toLocaleDateString('en-IN',{day:'numeric',month:'short'}):''}</small></div>`).join('')}`)}
async function upd(id,patch,re){const l=get(id);Object.assign(l,patch);render();if(re){const v=$('rm')?$('rm').value:'';openL(id);if(v)$('rm').value=v}const{error}=await SB.from('chasr_leads').update({...patch,updated_at:new Date().toISOString()}).eq('id',id);toast(error?'Save failed':'Saved')}
function saveR(id){const t=$('rm').value.trim();if(!t)return toast('Type a remark first');if(!FU)return toast('Pick the next follow-up date');const l=get(id);upd(id,{note:t,followup:FU,remarks:[...(l.remarks||[]),{text:t,at:new Date().toISOString(),by:S.me.name}]});cl()}
/* ---- add / edit ---- */
function form(id){const l=id?get(id):{segment:'Personal Loan'};sh(`<div class="hd"><h2>${id?'Edit lead':'New lead'}</h2><button class="x" onclick="cl()">${I('x')}</button></div><input class="in" id="fn" placeholder="Name" value="${esc(l.name||'')}"><input class="in" id="fm" type="tel" placeholder="Mobile number" value="${esc(l.mobile||'')}"><input class="in" id="fa" type="number" placeholder="Loan amount ₹" value="${l.amount||''}"><div class="chips" id="fs">${SEG.map(s=>`<button class="${l.segment==s?'on':''}" onclick="document.querySelectorAll('#fs button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${s}</button>`).join('')}</div><input class="in" id="fc" placeholder="Company / Source" value="${esc(l.company||l.source||'')}"><div class="lbl">Follow-up</div><input class="in" id="fd" type="date" min="${TD()}" value="${ed(l)}">${id?`<div class="lbl">Status</div><div class="chips" id="fst">${[['open','Open'],['converted','Converted'],['not_interested','Not interested'],['not_eligible','Not eligible']].map(([k,n])=>`<button data-v="${k}" class="${l.status==k?'on':''}" onclick="document.querySelectorAll('#fst button').forEach(b=>b.classList.remove('on'));this.classList.add('on')">${n}</button>`).join('')}</div>`:''}<button class="pri" onclick="saveF('${id||''}')">Save lead</button>`)}
async function saveF(id){const name=$('fn').value.trim();if(!name)return toast('Name is required');const r={name,mobile:$('fm').value.trim()||null,amount:$('fa').value||null,segment:document.querySelector('#fs .on').textContent,company:$('fc').value.trim()||null,followup:$('fd').value||null};const st=document.querySelector('#fst .on');if(st)r.status=st.dataset.v;
if(id){await upd(id,r);cl()}else{const{data,error}=await SB.from('chasr_leads').insert({...r,created_by:S.me.name}).select().single();if(error)return toast('Save failed');S.leads.unshift(data);cl();render();toast('Lead added')}}
/* ---- PDF ---- */
function exp(){sh(`<div class="hd"><h2>Print sheet (A4)</h2><button class="x" onclick="cl()">${I('x')}</button></div><p style="color:var(--mut)">Clean list with a big blank column for hand-written remarks. Choose "Save as PDF" in the print dialog.</p><div class="lbl">Segment</div><select class="in" id="es"><option>All</option>${SEG.map(s=>`<option>${s}</option>`).join('')}</select><div class="lbl">Leads</div><select class="in" id="et"><option value="open">Open only</option><option value="today">Due today &amp; overdue</option><option value="all">Everything</option></select><button class="pri" onclick="pdf()">Generate</button>`)}
function pdf(sg,t){sg=sg||$('es').value;t=t||$('et').value;const L=S.leads.filter(l=>(sg=='All'||l.segment==sg)&&(t=='all'||(t=='open'?l.status=='open':l.status=='open'&&(!l.followup||l.followup<=TD())))).sort((a,b)=>(a.followup||'')<(b.followup||'')?-1:(a.followup||'')>(b.followup||'')?1:a.name<b.name?-1:1),D=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
$('pr').innerHTML=`<header><div><h1>${sg=='All'?'All':esc(sg)} Leads</h1><p>Follow-up sheet for ${D}</p></div><div class="b"><b>CALLBOOK</b>${L.length} leads${S.me.name?' · '+esc(S.me.name):''}</div></header><table><thead><tr><th style="text-align:center">S.No</th><th>Name</th><th>Mobile</th><th>Previous remarks</th><th>Today's remarks</th></tr></thead><tbody>${L.map((l,i)=>{const pv=(l.remarks||[]).filter(r=>r.text&&r.by!='import').slice(-2).reverse().map(r=>`<div>${r.at?sd(String(r.at).slice(0,10))+' · ':''}${esc(String(r.text).slice(0,90))}</div>`).join('')||'—';return `<tr><td class="sn">${i+1}</td><td class="nm">${esc(l.name)}${l.company?`<br><small style="font-weight:500;color:#6b7194">${esc(l.company)}</small>`:''}</td><td class="mb">${esc(l.mobile||'')}</td><td class="pv">${pv}</td><td class="wr"></td></tr>`}).join('')}</tbody></table><footer>Generated by Callbook</footer>`;cl();setTimeout(()=>print(),150)}
/* ---- more / team / alerts ---- */
function more(){const a=S.me.role=='admin';sh(`<div class="hd"><h2>More</h2><button class="x" onclick="cl()">${I('x')}</button></div><button class="ghost" onclick="alerts()">${I('bell')} Enable today's-leads alerts</button>${a?`<div class="lbl">Team</div>${S.team.map(t=>`<div class="hist">${esc(t.name||t.email)}<small>${esc(t.email)} · ${t.role}</small></div>`).join('')}<input class="in" id="te" type="email" placeholder="Teammate email"><input class="in" id="tn" placeholder="Name"><button class="pri" onclick="addT()">Add teammate</button><p style="color:var(--mut);font-size:13px">They then tap "Create account" with that email.</p>`:''}<button class="ghost" onclick="try{localStorage.removeItem('cbName')}catch(e){}SB.auth.signOut().then(()=>location.reload())">${I('out')} Sign out</button>`)}
async function addT(){const e=$('te').value.trim().toLowerCase();if(!e)return;const{error}=await SB.from('chasr_team').insert({email:e,name:$('tn').value.trim()||e.split('@')[0]});if(error)return toast('Could not add');S.team.push({email:e,name:$('tn').value,role:'member'});more();toast('Teammate added')}
function alerts(){if(!('Notification' in window))return toast('Not supported here');Notification.requestPermission().then(p=>{toast(p=='granted'?'Alerts on':'Alerts blocked');if(p=='granted')notify()})}
function counts(){const o=S.leads.filter(l=>l.status=='open');return{ov:o.filter(l=>l.followup&&l.followup<TD()&&!hd(l)),td:o.filter(l=>(!l.followup||l.followup==TD())&&!hd(l))}}
function notify(){const{ov,td}=counts();if(Notification.permission=='granted'&&ov.length+td.length)new Notification('Callbook — today',{body:`${td.length} due today, ${ov.length} overdue`})}
function askName(){const d=document.createElement('div');d.className='ask';d.innerHTML=`<div><h1 class="logo">Callbook</h1><h2>What should we call you?</h2><input class="in" id="an" placeholder="Your name" autocomplete="given-name"><button class="pri" onclick="setName()">Continue</button></div>`;document.body.appendChild(d);setTimeout(()=>$('an').focus(),150)}
function setName(){const v=$('an').value.trim();if(!v)return toast('Enter your name');S.me.name=v;try{localStorage.cbName=v}catch(e){}document.querySelector('.ask').remove();render();popup()}
function ni(){const a=S.leads.filter(l=>l.status=='not_interested');sh(`<div class="hd"><h2>Not interested · ${a.length}</h2><button class="x" onclick="cl()">${I('x')}</button></div>${a.map(l=>`<div class="mrow"><div><b>${esc(l.name)}</b><small>${l.segment}${l.mobile?' · '+esc(l.mobile):''}</small></div><button onclick="reopen('${l.id}')">Reopen</button></div>`).join('')||'<div class="empty">None.</div>'}`)}
function reopen(id){upd(id,{status:'open',followup:TD()});ni()}
function popup(){let k;try{k=localStorage.cd}catch(e){}const{ov,td}=counts(),a=[...td,...ov].slice(0,5);if(k==TD()||!a.length)return;try{localStorage.cd=TD()}catch(e){}
sh(`<div class="hd"><div><h2>Today's leads</h2><p>${td.length} due today · ${ov.length} overdue</p></div><button class="x" onclick="cl()">${I('x')}</button></div><div style="margin-top:12px">${a.map(card).join('')}</div><button class="pri" onclick="cl()">Show my leads</button>`);notify()}
function deep(){const q=new URLSearchParams(location.search);if(q.get('tab')=='leads'){S.tab='leads';render()}if(q.get('action')=='add')form()}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state=='installed'&&navigator.serviceWorker.controller)toast('Update ready — reopen the app')})})}).catch(()=>{}));
boot();
</script></body></html>
