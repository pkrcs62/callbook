async function savePdf(sg){toast('Preparing PDF…');const pr=$('pr');try{if(!window.html2canvas)await lib('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');if(!window.jspdf)await lib('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');pr.classList.add('cap');if(document.fonts)await document.fonts.ready;const doc=new jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});const pgs=[...pr.querySelectorAll('.pg')];for(let i=0;i<pgs.length;i++){const c=await html2canvas(pgs[i],{scale:2,backgroundColor:'#ffffff',useCORS:true});if(i)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297)}pr.classList.remove('cap');doc.save('Callbook-'+sg.replace(/\s+/g,'-')+'-'+TD()+'.pdf');toast('PDF saved')}catch(e){pr.classList.remove('cap');toast('Could not save PDF — try Print')}}
/* ---- more / team / alerts ---- */
function more(){const a=false;sh(`<div class="hd"><h2>More</h2><button class="x" onclick="cl()">${I('x')}</button></div><div class="lbl">Theme</div><div class="chips">${[['auto','Auto'],['light','Light'],['dark','Dark']].map(([k,n])=>`<button class="${TP()==k?'on':''}" onclick="setTheme('${k}')">${n}</button>`).join('')}</div><p style="color:var(--mut);font-size:13px;margin:0 0 10px">Auto is dark from 6 PM to 6 AM.</p><button class="ghost" onclick="alerts()">${I('bell')} Enable today's-leads alerts</button>${a?`<div class="lbl">Team</div>${S.team.map(t=>`<div class="hist">${esc(t.name||t.email)}<small>${esc(t.email)} · ${t.role}</small></div>`).join('')}<input class="in" id="te" type="email" placeholder="Teammate email"><input class="in" id="tn" placeholder="Name"><button class="pri" onclick="addT()">Add teammate</button><p style="color:var(--mut);font-size:13px">They then tap "Create account" with that email.</p>`:''}<button class="ghost" onclick="try{localStorage.removeItem('cbName')}catch(e){}location.reload()">${I('out')} Change my name</button>`)}
async function addT(){const e=$('te').value.trim().toLowerCase();if(!e)return;const{error}=await SB.from('chasr_team').insert({email:e,name:$('tn').value.trim()||e.split('@')[0]});if(error)return toast('Could not add');S.team.push({email:e,name:$('tn').value,role:'member'});more();toast('Teammate added')}
function alerts(){if(!('Notification' in window))return toast('Not supported here');Notification.requestPermission().then(p=>{toast(p=='granted'?'Alerts on':'Alerts blocked');if(p=='granted')notify()})}
function counts(){const o=S.leads.filter(l=>l.status=='open');return{ov:o.filter(l=>l.followup&&l.followup<TD()&&!hd(l)),td:o.filter(l=>(!l.followup||l.followup==TD())&&!hd(l))}}
function notify(){const{ov,td}=counts();if(Notification.permission=='granted'&&ov.length+td.length)new Notification('Callbook — today',{body:`${td.length} due today, ${ov.length} overdue`})}
function askName(){const d=document.createElement('div');d.className='ask';d.innerHTML=`<div><h1 class="logo">Callbook</h1><h2>What should we call you?</h2><input class="in" id="an" placeholder="Your name" autocomplete="given-name"><button class="pri" onclick="setName()">Continue</button></div><div class="ver fx">Callbook ${VER}</div>`;document.body.appendChild(d);setTimeout(()=>$('an').focus(),150)}
function setName(){const v=$('an').value.trim();if(!v)return toast('Enter your name');S.me.name=v;try{localStorage.cbName=v}catch(e){}document.querySelector('.ask').remove();render()}
function ni(){const a=S.leads.filter(l=>l.status=='not_interested');sh(`<div class="hd"><h2>Not interested · ${a.length}</h2><button class="x" onclick="cl()">${I('x')}</button></div>${a.map(l=>`<div class="mrow"><div><b>${esc(l.name)}</b><small>${l.segment}${l.mobile?' · '+esc(l.mobile):''}</small></div><button onclick="reopen('${l.id}')">Reopen</button></div>`).join('')||'<div class="empty">None.</div>'}`)}
function reopen(id){upd(id,{status:'open',followup:TD()});ni()}
function mkNav(){$('nav').innerHTML=`<i class="ind"></i><button data-t="today" onclick="go('today')">${I('today')}Today</button><button data-t="leads" onclick="go('leads')">${I('list')}Leads</button><button class="fab" onclick="emi()">${I('calc')}</button><button onclick="exp()">${I('file')}PDF</button><button onclick="more()">${I('more')}More</button>`}
function navSet(){const n=$('nav');if(!n)return;n.style.display='flex';n.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));const a=n.querySelector('[data-t].on'),i=n.querySelector('.ind');if(a&&i){i.style.width=a.offsetWidth+'px';i.style.transform='translateX('+a.offsetLeft+'px)'}}
function go(t){if(S.tab==t)return;const f=()=>{S.tab=t;render()};if(document.startViewTransition){S.vt=1;document.startViewTransition(f).finished.finally(()=>S.vt=0)}else f()}
function cu(){document.querySelectorAll('.cu').forEach(e=>{const n=+e.dataset.n;if(+e.textContent===n)return;const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/650);e.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}
function notInt(id){const t=$('rm')?$('rm').value.trim():'',l=get(id);upd(id,Object.assign({status:'not_interested'},t?{note:t,remarks:[...(l.remarks||[]),{text:t,at:new Date().toISOString(),by:S.me.name}]}:{}));cl();toast('Moved to Not interested')}
(function(){const s=$('sh');let y0=0,dy=0,on=0,t0=0;s.addEventListener('touchstart',e=>{if(s.scrollTop>0||!e.target.closest('.grab,.hd'))return;on=1;y0=e.touches[0].clientY;t0=Date.now();dy=0;s.style.transition='none'},{passive:true});s.addEventListener('touchmove',e=>{if(!on)return;dy=Math.max(0,e.touches[0].clientY-y0);s.style.transform='translateY('+dy+'px)'},{passive:true});s.addEventListener('touchend',()=>{if(!on)return;on=0;s.style.transition='';s.style.transform='';if(dy>110||dy/(Date.now()-t0)>.6)cl()});

const TH={today:['#4f46e5','#7c3aed'],leads:['#0d9488','#2563eb'],'Car Loan':['#f97316','#ef4444'],'Personal Loan':['#2563eb','#0ea5e9'],'Pension Loan':['#059669','#14b8a6'],'Misc':['#d97706','#f59e0b']};
function theme(){const t=TH[S.seg!='All'?S.seg:S.tab]||TH.today,r=document.documentElement.style;r.setProperty('--ac',t[0]);r.setProperty('--ac2',t[1]);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t[0]}
const remH=r=>`<div class="hist">${esc(r.text)}<small>${r.by?'<b>'+esc(r.by)+'</b> · ':''}${r.at?new Date(r.at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):''}</small></div>`;
function popup(){let k;try{k=localStorage.cd}catch(e){}const{ov,td}=counts(),a=[...td,...ov].slice(0,5);if(k==TD()||!a.length)return;try{localStorage.cd=TD()}catch(e){}
sh(`<div class="hd"><div><h2>Today's leads</h2><p>${td.length} due today · ${ov.length} overdue</p></div><button class="x" onclick="cl()">${I('x')}</button></div><div style="margin-top:12px">${a.map(card).join('')}</div><button class="pri" onclick="cl()">Show my leads</button>`);notify()}
function deep(){const q=new URLSearchParams(location.search);if(q.get('tab')=='leads'){S.tab='leads';render()}if(q.get('action')=='add')form()}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{r.addEventListener('updatefound',()=>{const w=r.installing;w&&w.addEventListener('statechange',()=>{if(w.state=='installed'&&navigator.serviceWorker.controller)toast('Update ready — reopen the app')})})}).catch(()=>{}));
/* ---- swipe actions: right = attended (+ next day), left = delete ---- */
function attend(id){const l=get(id);if(!l)return;if(l.status!='open')return toast('Only open leads can be marked attended');const old={followup:l.followup,note:l.note,remarks:l.remarks||[]},nd=add(1);upd(id,{followup:nd,note:'Attended',remarks:[...old.remarks,{text:'Attended',at:new Date().toISOString(),by:S.me.name}]},false,true);toast('Attended · next follow-up '+sd(nd),()=>upd(id,old,false,true))}
function confirmDel(id){const l=get(id);if(!l)return;const d=document.createElement('div');d.className='cfm';d.innerHTML=`<div class="cb"><h2>Delete this lead?</h2><p><b>${esc(l.name)}</b>${l.mobile?' · '+esc(l.mobile):''}<br>This permanently removes the lead and all its remarks. It cannot be undone.</p><button class="dbtn" id="cdy">Delete lead</button><button class="ghost" id="cdn">Cancel</button></div>`;document.body.appendChild(d);d.onclick=e=>{if(e.target===d)d.remove()};$('cdn').onclick=()=>d.remove();$('cdy').onclick=async()=>{d.remove();const{data,error}=await SB.from('chasr_leads').delete().eq('id',id).select();if(error||!data||!data.length)return toast('Delete failed');S.leads=S.leads.filter(x=>x.id!=id);cl();render();toast('Lead deleted')}}
(function(){let w=null,last=0;const TH_=90;
document.addEventListener('touchstart',e=>{const c=e.target.closest('.sw .card');if(!c||e.target.closest('.acts')){w=null;return}const t=e.touches[0];w={c,p:c.parentNode,x:t.clientX,y:t.clientY,dx:0,go:0,hit:0}},{passive:true});
document.addEventListener('touchmove',e=>{if(!w)return;const t=e.touches[0],dx=t.clientX-w.x,dy=t.clientY-w.y;if(!w.go){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){w=null;return}if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4){w.go=1;w.c.classList.remove('snap');w.c.classList.add('dr')}else return}
w.dx=dx;w.c.style.transform='translateX('+(Math.max(-150,Math.min(150,dx)))+'px)';w.p.classList.toggle('sa',dx>0);w.p.classList.toggle('sd',dx<0);const hit=Math.abs(dx)>=TH_;if(hit&&!w.hit){try{navigator.vibrate(12)}catch(_){}}w.hit=hit},{passive:true});
function end(act){if(!w)return;const s=w;w=null;if(!s.go)return;last=Date.now();s.c.classList.remove('dr');s.c.classList.add('snap');s.c.style.transform='';setTimeout(()=>{s.p.classList.remove('sa','sd');s.c.classList.remove('snap')},300);if(!act)return;const id=s.p.dataset.id;if(s.dx>=TH_)attend(id);else if(s.dx<=-TH_)confirmDel(id)}
document.addEventListener('touchend',()=>end(1));document.addEventListener('touchcancel',()=>end(0));

function emiOne(o){

function emiSet(k,v){E[k]=(v==='true'?true:v==='false'?false:v);if(k=='sch')E.opts.forEach(o=>{if(+o.y>(v=='green'?8:7))o.y=7});emi(E.lid)}

function emiPdf(mode){emiRes();const R=QR.map((r,i)=>[r,i]).filter(x=>x[0].em);if(!R.length)return toast('Add a loan amount and CIBIL first');

const pill=t=>`<span style="background:#fff;border:1px solid #d9e2f6;border-radius:99px;padding:5px 13px;font-size:11px;font-weight:700;color:#2b2fa8">${t}</span>`;
const ben=[['%','Attractive interest rates'],['⇄','Flexible tenure'],['✓','Minimal documentation']].map(b=>`<div style="flex:1;background:#fff;border:1px solid #d9e2f6;border-radius:14px;padding:9px 10px;text-align:center;font-size:10.5px;font-weight:700;color:#2b2fa8"><div style="font-size:18px;color:#00a3e0">${b[0]}</div>${b[1]}</div>`).join('');
pr.innerHTML=`<section class="pg" style="padding:0;background:linear-gradient(180deg,#eef4ff,#fff 45%)"><div style="position:relative;overflow:hidden;background:linear-gradient(120deg,#1b1464 0%,#2b2fa8 58%,#00a3e0 130%);color:#fff;padding:9mm 12mm 10mm"><i style="position:absolute;right:-30px;top:-60px;width:200px;height:200px;border-radius:50%;background:#ffffff14"></i><i style="position:absolute;right:90px;bottom:-80px;width:150px;height:150px;border-radius:50%;background:#00c2ff26"></i><div style="position:relative;display:flex;justify-content:space-between;align-items:center"><div style="background:#fff;border-radius:14px;padding:7px 14px;box-shadow:0 10px 24px -12px #000a"><img src="${SBI_LOGO}" style="height:13mm;display:block"></div><div style="text-align:right;font-size:11px"><div style="opacity:.8;letter-spacing:.14em">DATE</div><b style="font-size:13px">${D}</b></div></div><div style="position:relative;margin-top:7mm"><div style="font-size:11px;letter-spacing:.3em;font-weight:700;opacity:.85">PERSONALISED PROPOSAL</div><div style="font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin-top:4px">${nm}<br>EMI Quotation</div><div style="margin-top:5mm;display:inline-block;background:#ffffff26;border-radius:99px;padding:6px 16px;font-size:13px">Prepared for <b>${esc(E.name||'Valued Customer')}</b></div></div></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;padding:5mm 12mm 3mm">${pill(E.typ=='sal'?'Salaried':'Business / Self-employed')}${pill(nm)}${on?pill('Vehicle price '+Rs(on)):''}${pill(R.length+(R.length>1?' options':' option'))}</div>
<div style="display:grid;grid-template-columns:${R.length==1?'1fr':'1fr 1fr'};gap:12px;padding:2mm 12mm 0">${R.map(card).join('')}</div>
${R.length<=4?`<div style="display:flex;gap:10px;padding:6mm 12mm 0">${ben}</div>`:''}

function emi(id){const l=id?get(id):null;if(id&&l){if(E.lid!==id){E.lid=id;E.name=l.name||'';E.mob=l.mobile||'';E.opts=[{a:l.amount?String(l.amount):'',y:7}]}}else if(E.lid){E.lid=null;E.name='';E.mob='';E.opts=[{a:'',y:7}]}
